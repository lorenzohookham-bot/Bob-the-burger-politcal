<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical World Leaders: Political Perspectives</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-left: #ef4444;
            --accent-centre: #3b82f6;
            --accent-right: #10b981;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--text-muted);
        }

        .btn.active[data-lens="left"] {
            background-color: var(--accent-left);
            border-color: var(--accent-left);
        }

        .btn.active[data-lens="centre"] {
            background-color: var(--accent-centre);
            border-color: var(--accent-centre);
        }

        .btn.active[data-lens="right"] {
            background-color: var(--accent-right);
            border-color: var(--accent-right);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }

        .card .meta {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .card p {
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
        }

        .card .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tag-positive { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-critical { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>World Leaders & Political Frameworks</h1>
        <p>Explore historical evaluations of key world leaders analyzed through different political and economic perspectives.</p>
    </header>

    <div class="controls">
        <button class="btn active" data-lens="left" onclick="switchLens('left')">Left-Leaning Lens</button>
        <button class="btn" data-lens="centre" onclick="switchLens('centre')">Centrist Lens</button>
        <button class="btn" data-lens="right" onclick="switchLens('right')">Right-Leaning Lens</button>
    </div>

    <main id="content">
        <!-- Content dynamically injected via JavaScript -->
    </main>

    <footer>
        <p>Historical evaluation depends heavily on political values, economic priorities, and historical context.</p>
    </footer>
</div>

<script>
    const data = {
        left: {
            description: "The left-leaning perspective emphasizes social equality, state-supported public welfare, public healthcare/education, labor rights, and public oversight of key industries.",
            positiveLeaders: [
                {
                    name: "Clement Attlee",
                    role: "Prime Minister of the UK (1945–1951)",
                    highlights: "Established the National Health Service (NHS), expanded social security, and oversaw key welfare reforms post-WWII.",
                    critique: "Faced severe economic strain, post-war austerity, and currency devaluation challenges."
                },
                {
                    name: "Franklin D. Roosevelt",
                    role: "President of the US (1933–1945)",
                    highlights: "Implemented the New Deal, introduced Social Security, regulated financial markets, and expanded public works.",
                    critique: "Faced criticism for executive overreach and controversial policies like Japanese-American internment."
                }
            ],
            criticalLeaders: [
                {
                    name: "Margaret Thatcher",
                    role: "Prime Minister of the UK (1979–1990)",
                    highlights: "Privatized state industries, deregulated financial markets, and reduced public spending.",
                    critique: "Critiqued by the left for rising wealth inequality, regional industrial decline, and weakening trade unions."
                },
                {
                    name: "Augusto Pinochet",
                    role: "Dictator of Chile (1973–1990)",
                    highlights: "Implemented free-market economic reforms under advice from free-market economists.",
                    critique: "Widespread human rights abuses, violent repression of political dissent, and suppression of labor unions."
                }
            ]
        },
        centre: {
            description: "The centrist perspective favors pragmatic governance, mixed market economies, institutional stability, democratic procedures, and incremental policy reform.",
            positiveLeaders: [
                {
                    name: "Dwight D. Eisenhower",
                    role: "President of the US (1953–1961)",
                    highlights: "Balanced national budget, expanded the Interstate Highway System, maintained New Deal programs, and cautioned against the military-industrial complex.",
                    critique: "Critiqued for cautious approach during the early civil rights movement and covert foreign operations."
                },
                {
                    name: "Nelson Mandela",
                    role: "President of South Africa (1994–1999)",
                    highlights: "Led peaceful transition out of Apartheid, prioritized national reconciliation, democratic institution building, and economic stability.",
                    critique: "Faced criticism from some factions for preserving existing economic ownership structures."
                }
            ],
            criticalLeaders: [
                {
                    name: "Joseph Stalin",
                    role: "Leader of the Soviet Union (1924–1953)",
                    highlights: "Rapid industrialization of the Soviet Union and role in defeating Nazi Germany.",
                    critique: "Totalitarian rule, extensive purges, political repression, labor camps (Gulags), and forced collectivization causing massive famine."
                },
                {
                    name: "Adolf Hitler",
                    role: "Führer of Germany (1933–1945)",
                    highlights: "N/A",
                    critique: "Facilitated global conflict in WWII, systematic genocide during the Holocaust, total destruction of democratic institutions."
                }
            ]
        },
        right: {
            description: "The right-leaning perspective prioritizes individual liberty, free-market capitalism, reduced government regulation, deregulation, national security, and traditional institutions.",
            positiveLeaders: [
                {
                    name: "Ronald Reagan",
                    role: "President of the US (1981–1989)",
                    highlights: "Championed tax cuts, deregulation, free markets, strong defense posture against communism, and economic expansion.",
                    critique: "Critiqued for growing national debt, reduced social spending, and deregulation of financial sectors."
                },
                {
                    name: "Margaret Thatcher",
                    role: "Prime Minister of the UK (1979–1990)",
                    highlights: "Restructured the UK economy through privatization, lower income tax rates, anti-inflationary monetary policies, and strong national defense.",
                    critique: "Faced significant opposition from industrial sectors and labor unions."
                }
            ],
            criticalLeaders: [
                {
                    name: "Mao Zedong",
                    role: "Chairman of the Chinese Communist Party (1949–1976)",
                    highlights: "Unification of China and establishment of the People's Republic of China.",
                    critique: "Centralized state control, severe economic mismanagement during the Great Leap Forward causing widespread famine, and the destructive impacts of the Cultural Revolution."
                },
                {
                    name: "Hugo Chávez",
                    role: "President of Venezuela (1999–2013)",
                    highlights: "Expanded social spending programs using oil revenues.",
                    critique: "High inflation, nationalization of private industries, democratic backsliding, and long-term economic instability."
                }
            ]
        }
    };

    function switchLens(lensKey) {
        document.querySelectorAll('.btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lens === lensKey) {
                btn.classList.add('active');
            }
        });

        const lensData = data[lensKey];
        const contentArea = document.getElementById('content');

        contentArea.innerHTML = `
            <p style="margin-bottom: 2rem; color: var(--text-muted); font-size: 1.05rem; background: var(--card-bg); padding: 1rem; border-radius: 8px; border-left: 4px solid var(--accent-${lensKey});">
                ${lensData.description}
            </p>

            <h2 class="section-title">Favorably Assessed under this Lens</h2>
            <div class="grid">
                ${lensData.positiveLeaders.map(leader => `
                    <div class="card">
                        <h3>${leader.name}</h3>
                        <div class="meta">${leader.role}</div>
                        <p><span class="tag tag-positive">Key Highlights</span></p>
                        <p>${leader.highlights}</p>
                        <p><span class="tag tag-critical">Common Counter-Points</span></p>
                        <p>${leader.critique}</p>
                    </div>
                `).join('')}
            </div>

            <h2 class="section-title">Unfavorably Assessed under this Lens</h2>
            <div class="grid">
                ${lensData.criticalLeaders.map(leader => `
                    <div class="card">
                        <h3>${leader.name}</h3>
                        <div class="meta">${leader.role}</div>
                        <p><span class="tag tag-critical">Primary Criticism</span></p>
                        <p>${leader.critique}</p>
                        <p><span class="tag tag-positive">Noted Achievements</span></p>
                        <p>${leader.highlights}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    // Initial render
    switchLens('left');
</script>

</body>
</html>
